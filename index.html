<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>机械键盘</title>
  <link rel="stylesheet" href="/src/tokens.css" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="stage"></canvas>

  <header class="head">
    <h1>机械键盘</h1>
    <p>Blender 建模 · 实时物理 · 合成音效</p>
  </header>

  <div class="typed" id="typed" aria-live="off"><span id="typedText"></span><i class="caret"></i></div>

  <div class="loading" id="loading">正在加载模型…</div>

  <section class="bar" id="bar">
    <div class="group">
      <span class="label">轴体</span>
      <div class="seg" id="profiles"></div>
    </div>
    <div class="group">
      <span class="label">音量</span>
      <input type="range" id="volume" min="0" max="100" value="70" />
      <span class="tabular val" id="volumeVal">70</span>
    </div>
    <div class="group">
      <button class="chip" id="pullMode">拔键帽</button>
      <button class="btn btn-sm" id="explode">全部弹飞</button>
      <button class="btn btn-sm btn-primary" id="restore">装回键帽</button>
      <button class="btn btn-sm" id="resetView">重置视角</button>
    </div>
  </section>

  <p class="hint">直接敲键盘，或用鼠标点按键 · 右键拔下键帽 · 在旋钮上滚动滚轮调音量 · 拖动空白处旋转视角</p>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
